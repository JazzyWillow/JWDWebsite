<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>MindAR Test 4</title>

  <!-- 1. A-Frame 1.6.0 -->
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>

  <!-- 2. MindAR for A-Frame -->
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <!-- 3. Chroma Key Shader Component for Green Screen Removal -->
  <script src="https://unpkg.com/aframe-chromakey-material/dist/aframe-chromakey-material.min.js"></script>

  <style>
    /* Prevent document scrollbars & ensure full viewport coverage */
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #000;
    }

    /* Force the canvas/camera stream full screen to prevent white margins */
    a-scene, a-canvas, video {
      position: absolute !important;
      top: 0 !important;
      left: 0 !important;
      width: 100vw !important;
      height: 100vh !important;
      margin: 0 !important;
      padding: 0 !important;
    }

    /* Hide Eruda container & white bottom bar */
    #eruda, .eruda-container {
      display: none !important;
    }

    /* Fullscreen tap-to-start overlay */
    #start-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: rgba(0, 0, 0, 0.85);
      z-index: 99999;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      color: white;
      font-family: sans-serif;
    }

    #start-btn {
      padding: 15px 30px;
      font-size: 18px;
      font-weight: bold;
      color: #fff;
      background-color: #007bff;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      margin-top: 20px;
    }
  </style>
</head>
<body>

  <!-- Tap-to-Start Screen -->
  <div id="start-overlay">
    <h2>Tap to Start AR</h2>
    <p>Camera and video access required</p>
    <button id="start-btn">Start Experience</button>
  </div>

  <!-- MindAR Scene Configured for Low Jitter -->
  <a-scene
    mindar-image="imageTargetSrc: targets.mind; filterMinCF: 0.0001; filterBeta: 0.001; uiLoading: no; uiScanning: yes;"
    embedded
    color-space="sRGB"
    renderer="colorManagement: true, physicallyCorrectLights"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">

    <a-assets>
      <video
        id="greenscreen-video"
        src="assets/specimen001.mp4"
        loop="true"
        crossorigin="anonymous"
        playsinline
        webkit-playsinline>
      </video>
    </a-assets>

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <!-- Target Anchor (index 0 matches target in targets.mind) -->
    <a-entity mindar-image-target="targetIndex: 0" id="target-anchor">
      <a-plane
        material="shader: chromakey; src: #greenscreen-video; color: 0.1 0.9 0.1;"
        position="0 0 0"
        height="0.9"
        width="1.6"
        rotation="0 0 0">
      </a-plane>
    </a-entity>
  </a-scene>

  <script>
    const overlay = document.getElementById('start-overlay');
    const startBtn = document.getElementById('start-btn');
    const video = document.getElementById('greenscreen-video');
    const targetAnchor = document.getElementById('target-anchor');

    let lostTimeout = null;

    // Unlock Web Audio & Video on user click
    startBtn.addEventListener('click', () => {
      overlay.style.display = 'none';
      video.play().then(() => video.pause());
    });

    // Instant play when target is found
    targetAnchor.addEventListener('targetFound', () => {
      if (lostTimeout) {
        clearTimeout(lostTimeout);
        lostTimeout = null;
      }
      video.play();
    });

    // Debounced pause to prevent video stuttering on brief frame drops
    targetAnchor.addEventListener('targetLost', () => {
      lostTimeout = setTimeout(() => {
        video.pause();
      }, 500);
    });
  </script>

</body>
</html>
