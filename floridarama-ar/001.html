<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>MindAR Test</title>

  <!-- A-Frame (1.5.0 compatible with MindAR 1.2.5) -->
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>

  <!-- MindAR for A-Frame -->
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <!-- Chroma Key Shader Component for Green Screen -->
  <script src="https://unpkg.com/aframe-chromakey-material/dist/aframe-chromakey-material.min.js"></script>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    /* Start Overlay */
    #start-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.85);
      z-index: 99999;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      color: white;
      font-family: sans-serif;
    }

    #start-btn {
      padding: 12px 24px;
      font-size: 16px;
      font-weight: bold;
      color: #fff;
      background-color: #007bff;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      margin-top: 15px;
    }
  </style>
</head>
<body>

  <!-- Start Overlay -->
  <div id="start-overlay">
    <h2>Tap to Start AR</h2>
    <button id="start-btn">Start Experience</button>
  </div>

  <!-- MindAR Scene -->
  <a-scene
    mindar-image="imageTargetSrc: targets.mind;"
    embedded
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">

    <a-assets>
      <video
        id="greenscreen-video"
        src="assets/specimen001.mp4"
        loop="true"
        crossorigin="anonymous"
        playsinline
        webkit-playsinline>
      </video>
    </a-assets>

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <!-- Target Anchor -->
    <a-entity mindar-image-target="targetIndex: 0" id="target-anchor">
      <a-plane
        material="shader: chromakey; src: #greenscreen-video; color: 0.1 0.9 0.1;"
        position="0 0 0"
        height="0.9"
        width="1.6">
      </a-plane>
    </a-entity>
  </a-scene>

  <script>
    const overlay = document.getElementById('start-overlay');
    const startBtn = document.getElementById('start-btn');
    const video = document.getElementById('greenscreen-video');
    const targetAnchor = document.getElementById('target-anchor');

    let lostTimeout = null;

    // Unlock Web Audio / Video stream on user interaction
    startBtn.addEventListener('click', () => {
      overlay.style.display = 'none';
      video.play().then(() => video.pause());
    });

    // Play video when target recognized
    targetAnchor.addEventListener('targetFound', () => {
      if (lostTimeout) {
        clearTimeout(lostTimeout);
        lostTimeout = null;
      }
      video.play();
    });

    // Pause video when target lost (debounced)
    targetAnchor.addEventListener('targetLost', () => {
      lostTimeout = setTimeout(() => {
        video.pause();
      }, 500);
    });
  </script>

</body>
</html>
