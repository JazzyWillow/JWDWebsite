<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>FloridaRAMA AR Test - Smooth Video</title>
  
  <!-- Eruda mobile console -->
  <script src="https://cdn.jsdelivr.net/npm/eruda"></script>
  <script>eruda.init();</script>

  <!-- A-Frame 1.6.0 -->
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>

  <!-- AR.js for A-Frame -->
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

  <!-- Chroma Key Shader Component for Green Screen Removal -->
  <script src="https://unpkg.com/aframe-chromakey-material/dist/aframe-chromakey-material.min.js"></script>

  <style>
    #start-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: rgba(0, 0, 0, 0.85);
      z-index: 9999;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      color: white;
      font-family: sans-serif;
    }

    #start-btn {
      padding: 15px 30px;
      font-size: 18px;
      font-weight: bold;
      color: #fff;
      background-color: #007bff;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      margin-top: 20px;
    }
  </style>

  <script>
    // Custom Component: Decouples rendering from raw marker jitter using LERP
    AFRAME.registerComponent('marker-follower', {
      schema: {
        target: { type: 'selector' },
        lerpRatio: { type: 'number', default: 0.12 } // Lower = silky smooth (slower lag), Higher = faster tracking
      },
      init: function () {
        this.visible = false;
        this.el.object3D.visible = false;
      },
      tick: function () {
        if (!this.data.target) return;

        const targetObj = this.data.target.object3D;
        const currentObj = this.el.object3D;

        // Only track when marker is active
        if (this.data.target.getAttribute('visible') === true) {
          if (!this.visible) {
            // First detection: snap immediately to prevent delayed fly-in
            currentObj.position.copy(targetObj.position);
            currentObj.quaternion.copy(targetObj.quaternion);
            this.visible = true;
            this.el.object3D.visible = true;
          } else {
            // Linear Interpolation (LERP) for Position
            currentObj.position.lerp(targetObj.position, this.data.lerpRatio);
            
            // Spherical Interpolation (SLERP) for Rotation
            currentObj.quaternion.slerp(targetObj.quaternion, this.data.lerpRatio);
          }
        } else {
          if (this.visible) {
            this.visible = false;
            this.el.object3D.visible = false;
          }
        }
      }
    });
  </script>
</head>
<body style="margin: 0; overflow: hidden;">

  <!-- Tap-to-Start Screen -->
  <div id="start-overlay">
    <h2>Tap to Start AR</h2>
    <p>Camera and video access required</p>
    <button id="start-btn">Start Experience</button>
  </div>

  <a-scene
    embedded
    arjs="sourceType: webcam; debugUIEnabled: false; detectionMode: mono_and_matrix; matrixCodeType: 3x3; sourceWidth: 1280; sourceHeight: 720; displayWidth: 1280; displayHeight: 720;"
    vr-mode-ui="enabled: false">

    <a-assets>
      <video
        id="greenscreen-video"
        src="assets/specimen001.mp4"
        loop="true"
        crossorigin="anonymous"
        playsinline
        webkit-playsinline>
      </video>
    </a-assets>

    <!-- 1. The Raw Marker (Invisible Anchor) -->
    <a-marker type="barcode" value="1" id="barcode-marker"></a-marker>

    <!-- 2. The Smoothed Entity (Follows marker with Lerp filter) -->
    <a-entity id="smoothed-container" marker-follower="target: #barcode-marker; lerpRatio: 0.10;">
      
      <!-- Video Plane placed inside the smoothed container -->
      <a-plane
        material="shader: chromakey; src: #greenscreen-video; color: 0.1 0.9 0.1;"
        position="0 .1 -3"  
        rotation="-90 0 0"
        width="1.6"
        height="0.9"
        scale="10 10 10">
      </a-plane>

    </a-entity>

    <!-- Camera Entity -->
    <a-entity camera></a-entity>
  </a-scene>

  <script>
    const overlay = document.getElementById('start-overlay');
    const startBtn = document.getElementById('start-btn');
    const video = document.getElementById('greenscreen-video');
    const marker = document.getElementById('barcode-marker');

    startBtn.addEventListener('click', () => {
      overlay.style.display = 'none';
      video.play();
      video.pause();
    });

    marker.addEventListener('markerFound', () => {
      video.play();
    });

    marker.addEventListener('markerLost', () => {
      video.pause();
    });
  </script>

</body>
</html>
