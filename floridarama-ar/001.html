
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>ARTest 13.1</title>

  <script src="https://cdn.jsdelivr.net/npm/eruda"></script>
  <script>eruda.init();</script>

  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>

  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

  <script src="https://unpkg.com/aframe-chromakey-material/dist/aframe-chromakey-material.min.js"></script>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
    }

    #start-overlay {
      position: fixed;
      inset: 0;
      background-color: rgba(0, 0, 0, 0.85);
      z-index: 9999;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      color: white;
      font-family: sans-serif;
    }

    #start-btn {
      padding: 15px 30px;
      font-size: 18px;
      font-weight: bold;
      color: #fff;
      background-color: #007bff;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      margin-top: 20px;
    }

    #fallback-btn {
      position: fixed;
      left: 50%;
      bottom: max(20px, env(safe-area-inset-bottom));
      transform: translateX(-50%);
      z-index: 10000;
      padding: 14px 22px;
      font-size: 16px;
      font-weight: bold;
      color: white;
      background: rgba(0, 0, 0, 0.75);
      border: 2px solid white;
      border-radius: 10px;
      white-space: nowrap;
    }

    #fallback-screen {
      position: fixed;
      inset: 0;
      z-index: 20000;
      background: black;
      display: none;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    #fallback-video {
      width: 100vw;
      height: 100vh;
      object-fit: contain;
      display: block;
    }

    #back-to-ar {
      position: fixed;
      left: 50%;
      bottom: max(20px, env(safe-area-inset-bottom));
      transform: translateX(-50%);
      z-index: 20001;
      padding: 12px 20px;
      font-size: 15px;
      font-weight: bold;
      color: white;
      background: rgba(0, 0, 0, 0.7);
      border: 2px solid white;
      border-radius: 10px;
    }

    canvas.a-canvas {
      position: fixed !important;
      top: 0 !important;
      left: 0 !important;
      width: 100vw !important;
      height: 100vh !important;
    }
  </style>
</head>

<body>

  <div id="start-overlay">
    <h2>Tap to Start AR</h2>
    <p>Camera and video access required</p>
    <button id="start-btn">Start Experience</button>
  </div>

  <button id="fallback-btn">Can't Use AR? Watch Video</button>

  <div id="fallback-screen">
    <video
      id="fallback-video"
      src="assets/specimen001.mp4"
      playsinline
      webkit-playsinline
      controls>
    </video>

    <button id="back-to-ar">Back to AR</button>
  </div>

  <a-scene
    id="ar-scene"
    embedded
    renderer="antialias: true; alpha: true; precision: medium;"
    arjs="
      sourceType: webcam;
      debugUIEnabled: false;
      detectionMode: mono_and_matrix;
      matrixCodeType: 3x3;
    "
    vr-mode-ui="enabled: false">

    <a-assets>
      <video
        id="greenscreen-video"
        src="assets/specimen001ar.mp4"
        loop
        muted
        playsinline
        webkit-playsinline
        crossorigin="anonymous">
      </video>
    </a-assets>

    <a-marker
      type="barcode"
      value="2"
      size="0.03175"
      id="barcode-marker"
      smooth="true"
      smoothCount="30"
      smoothTolerance="0.02"
      smoothThreshold="10">

      <a-plane
        material="shader: chromakey; src: #greenscreen-video; color: 0.1 0.9 0.1;"
        position="0 0.1 0"
        rotation="-90 0 0"
        width="16"
        height="9">
      </a-plane>

    </a-marker>

    <a-entity camera></a-entity>

  </a-scene>

  <script>
    const overlay = document.getElementById('start-overlay');
    const startBtn = document.getElementById('start-btn');
    const fallbackBtn = document.getElementById('fallback-btn');
    const fallbackScreen = document.getElementById('fallback-screen');
    const fallbackVideo = document.getElementById('fallback-video');

    const arScene = document.getElementById('ar-scene');
    const video = document.getElementById('greenscreen-video');
    const marker = document.getElementById('barcode-marker');

    let lostTimeout = null;

    startBtn.addEventListener('click', () => {
      overlay.style.display = 'none';

      video.muted = true;

      video.play().then(() => {
        video.pause();
        video.currentTime = 0;
      }).catch(error => {
        console.log('Video unlock error:', error);
      });
    });

    marker.addEventListener('markerFound', () => {
      console.log('MARKER FOUND');

      if (lostTimeout) {
        clearTimeout(lostTimeout);
        lostTimeout = null;
      }

      video.muted = true;

      video.play().catch(error => {
        console.log('Video play error:', error);
      });
    });

    marker.addEventListener('markerLost', () => {
      console.log('MARKER LOST');

      lostTimeout = setTimeout(() => {
        video.pause();
      }, 500);
    });

    fallbackBtn.addEventListener('click', async () => {
      console.log('Switching to fallback video');

      video.pause();

      if (lostTimeout) {
        clearTimeout(lostTimeout);
        lostTimeout = null;
      }

      const arjsComponent = arScene.components['arjs'];

      if (arjsComponent && arjsComponent.arToolkitSource) {
        const source = arjsComponent.arToolkitSource;
        const sourceElement = source.domElement;

        if (sourceElement && sourceElement.srcObject) {
          sourceElement.srcObject.getTracks().forEach(track => track.stop());
          sourceElement.srcObject = null;
        }

        if (sourceElement) {
          sourceElement.pause();
          sourceElement.src = '';
        }
      }

      arScene.style.display = 'none';
      fallbackBtn.style.display = 'none';
      overlay.style.display = 'none';

      fallbackScreen.style.display = 'flex';

      try {
        await fallbackVideo.play();

        if (fallbackScreen.requestFullscreen) {
          await fallbackScreen.requestFullscreen();
        } else if (fallbackScreen.webkitRequestFullscreen) {
          fallbackScreen.webkitRequestFullscreen();
        }
      } catch (error) {
        console.log('Fallback video error:', error);
      }
    });

    document.getElementById('back-to-ar').addEventListener('click', () => {
      if (document.fullscreenElement) {
        document.exitFullscreen().catch(() => {});
      }

      fallbackVideo.pause();
      fallbackVideo.currentTime = 0;

      fallbackScreen.style.display = 'none';
      arScene.style.display = '';
      fallbackBtn.style.display = 'block';

      overlay.style.display = 'flex';
    });
  </script>

</body>
</html>
```
