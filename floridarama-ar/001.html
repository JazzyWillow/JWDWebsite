<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>MindAR Test 3</title>

  <!-- A-Frame & MindAR -->
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
  <script src="https://unpkg.com/aframe-chromakey-material/dist/aframe-chromakey-material.min.js"></script>

  <style>
    /* Prevent scrollbars & white background gaps */
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #000;
    }

    /* Force full-screen video and WebGL canvas execution */
    a-scene, a-canvas, video {
      position: absolute !important;
      top: 0 !important;
      left: 0 !important;
      width: 100vw !important;
      height: 100vh !important;
      margin: 0 !important;
      padding: 0 !important;
    }

    /* Hide Eruda mobile console white bar at bottom */
    #eruda, .eruda-container {
      display: none !important;
    }

    /* Fullscreen tap-to-start overlay */
    #start-overlay {
      position: fixed;
      top: 0; 
      left: 0; 
      width: 100vw; 
      height: 100vh;
      background-color: rgba(0, 0, 0, 0.85);
      z-index: 99999;
      display: flex; 
      flex-direction: column; 
      justify-content: center; 
      align-items: center;
      color: white; 
      font-family: sans-serif;
    }

    #start-btn {
      padding: 15px 30px; 
      font-size: 18px; 
      font-weight: bold;
      color: #fff; 
      background-color: #007bff; 
      border: none; 
      border-radius: 8px;
      cursor: pointer; 
      margin-top: 20px;
    }
  </style>
</head>
<body>

  <!-- Tap to Start -->
  <div id="start-overlay">
    <h2>Tap to Start AR</h2>
    <p>Camera and video access required</p>
    <button id="start-btn">Start Experience</button>
  </div>

  <!-- uiScanning enabled brings back scanning guide; uiLoading: no disables loading overlay -->
  <a-scene 
    mindar-image="imageTargetSrc: ./assets/targets.mind; filterMinCF: 0.0001; filterBeta: 0.001; uiLoading: no; uiScanning: yes;" 
    embedded 
    color-space="sRGB" 
    renderer="colorManagement: true, physicallyCorrectLights" 
    vr-mode-ui="enabled: false" 
    device-orientation-permission-ui="enabled: false">
    
    <a-assets>
      <video id="greenscreen-video" src="assets/specimen001.mp4" loop="true" crossorigin="anonymous" playsinline webkit-playsinline></video>
    </a-assets>

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <a-entity mindar-image-target="targetIndex: 0" id="target-anchor">
      <a-plane 
        material="shader: chromakey; src: #greenscreen-video; color: 0.1 0.9 0.1;" 
        position="0 0 0" 
        height="0.5625" 
        width="1" 
        rotation="0 0 0">
      </a-plane>
    </a-entity>
  </a-scene>

  <script>
    const overlay = document.getElementById('start-overlay');
    const startBtn = document.getElementById('start-btn');
    const video = document.getElementById('greenscreen-video');
    const targetAnchor = document.getElementById('target-anchor');

    startBtn.addEventListener('click', () => {
      overlay.style.display = 'none';
      video.play().then(() => video.pause());
    });

    targetAnchor.addEventListener('targetFound', () => {
      video.play();
    });

    targetAnchor.addEventListener('targetLost', () => {
      video.pause();
    });
  </script>
</body>
</html>
