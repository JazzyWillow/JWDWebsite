<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>FloridaRAMA AR Test - Specimen 003 - 1</title>
  
  <!-- Eruda mobile console -->
  <script src="https://cdn.jsdelivr.net/npm/eruda"></script>
  <script>
    eruda.init();
  </script>


  <!-- A-Frame 1.6.0 -->
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>

  <!-- 2. Include AR.js for A-Frame -->
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

  <!-- 3. Include Chroma Key Shader Component for Green Screen Removal -->
  <script src="https://unpkg.com/aframe-chromakey-material/dist/aframe-chromakey-material.min.js"></script>



<style>
    /* Fullscreen UI Overlay to satisfy mobile browser autoplay policy */
    #start-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: rgba(0, 0, 0, 0.85);
      z-index: 9999;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      color: white;
      font-family: sans-serif;
    }

    #start-btn {
      padding: 15px 30px;
      font-size: 18px;
      font-weight: bold;
      color: #fff;
      background-color: #007bff;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      margin-top: 20px;
    }
  </style>
</head>
<body style="margin: 0; overflow: hidden;">

  <!-- Tap-to-Start Screen -->
  <div id="start-overlay">
    <h2>Tap to Start AR</h2>
    <p>Camera and video access required</p>
    <button id="start-btn">Start Experience</button>
  </div>

  <!-- A-Frame AR Scene Configured for Barcode Markers -->
  <a-scene
    embedded
    arjs="sourceType: webcam; debugUIEnabled: false; detectionMode: mono_and_matrix; matrixCodeType: 3x3;"
    vr-mode-ui="enabled: false">

    <a-assets>
      <!-- Preload the Green Screen MP4 Video -->
      <video
        id="greenscreen-video"
        src="assets/specimen003.mp4"
        loop="true"
        crossorigin="anonymous"
        playsinline
        webkit-playsinline>
      </video>
    </a-assets>

    <!-- Barcode Marker (Targeting Barcode Value 3) -->
    <a-marker type="barcode" value="1" id="barcode-marker">
      
      <!-- 
        Plane with Chromakey Material Shader:
        - color: Target green color to key out (0.1 0.9 0.1 is standard)
      -->
      <a-plane
        material="shader: chromakey; src: #greenscreen-video; color: 0.1 0.9 0.1;"
        position="0 0.1 0"
        rotation="-90 0 0"
        width="1.6"
        height="0.9"
        scale="3 3 3">
      </a-plane>

    </a-marker>

    <!-- Camera Entity -->
    <a-entity camera></a-entity>
  </a-scene>

  <script>
    const overlay = document.getElementById('start-overlay');
    const startBtn = document.getElementById('start-btn');
    const video = document.getElementById('greenscreen-video');
    const marker = document.getElementById('barcode-marker');

    // 1. Unlock Web Audio & Video on user click
    startBtn.addEventListener('click', () => {
      overlay.style.display = 'none';
      video.play();
      video.pause(); // Pre-load and pause until marker is detected
    });

    // 2. Play video when marker is detected
    marker.addEventListener('markerFound', () => {
      video.play();
    });

    // 3. Pause video when marker leaves camera view
    marker.addEventListener('markerLost', () => {
      video.pause();
    });
  </script>

</body>
</html>
