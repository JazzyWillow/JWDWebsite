<!DOCTYPE html>
<html lang="en">
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <title>Test 5</title>


    <!-- A-Frame Library -->
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
    <!-- MindAR Image Tracking for A-Frame -->
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

    <style>
      /* Ensure full screen without scrollbars */
      body { margin: 0; overflow: hidden; }
    </style>
  </head>

  <body>
    <!-- 
      imageTargetSrc points to your compiled .mind file.
      uiLoading: false hides default loading overlay if you want custom UI.
    -->
    <a-scene 
      mindar-image="imageTargetSrc: image-targets/targets.mind;" 
      color-space="sRGB" 
      renderer="colorManagement: true, physicallyCorrectLights: true" 
      vr-mode-ui="enabled: false" 
      device-orientation-permission-ui="enabled: false">
      
      <a-assets>
        <!-- Preload the video element -->
        <video 
          id="specimen-video" 
          src="assets/specimen002ar.mp4" 
          preload="auto" 
          loop 
          crossorigin="anonymous" 
          playsinline 
          webkit-playsinline>
        </video>
      </a-assets>

      <!-- Camera container -->
      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <!-- 
        targetIndex: 0 maps to the first image inside your targets.mind file.
        Adjust width/height ratios on <a-video> to match your video's aspect ratio.
      -->
      <a-entity mindar-image-target="targetIndex: 0" id="tag-target">
        <a-video 
          src="#specimen-video" 
          width="1" 
          height="1.7778"
          height="0.5625" 
          position="0 0 0" 
          rotation="0 0 0">
        </a-video>
      </a-entity>

    </a-scene>

    <script>
      // Video Autoplay/Pause logic linked to MindAR target detection
      const tagTarget = document.querySelector('#tag-target');
      const video = document.querySelector('#specimen-video');

      tagTarget.addEventListener("targetFound", () => {
        video.play().catch((err) => {
          console.log("Autoplay prevented or waiting for interaction:", err);
        });
      });

      tagTarget.addEventListener("targetLost", () => {
        video.pause();
      });
    </script>
  </body>
</html>
