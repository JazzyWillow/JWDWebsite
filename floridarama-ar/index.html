<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>FloridaRAMA AR Test - Transperent Video 2</title>
  
  <!-- Eruda mobile console -->
  <script src="https://cdn.jsdelivr.net/npm/eruda"></script>
  <script>
    eruda.init();
  </script>


  <!-- A-Frame 1.6.0 -->
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>

  <!-- 2. Include AR.js for A-Frame -->
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

  <!-- 3. Include Chroma Key Shader Component for Green Screen Removal -->
  <script src="https://unpkg.com/aframe-chromakey-material/dist/aframe-chromakey-material.min.js"></script>
<style>
    #start-overlay {
      position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(0, 0, 0, 0.85); z-index: 9999;
      display: flex; flex-direction: column; justify-content: center; align-items: center;
      color: white; font-family: sans-serif;
    }
    #start-btn {
      padding: 15px 30px; font-size: 18px; font-weight: bold;
      color: #fff; background-color: #007bff; border: none; border-radius: 8px; cursor: pointer;
    }
  </style>
</head>
<body style="margin: 0; overflow: hidden;">

  <div id="start-overlay">
    <h2>Tap to Start AR</h2>
    <button id="start-btn">Start Experience</button>
  </div>

  <a-scene
    embedded
    arjs="sourceType: webcam; debugUIEnabled: false; detectionMode: mono_and_matrix; matrixCodeType: 3x3;"
    vr-mode-ui="enabled: false">

    <a-assets>
      <video
        id="ar-video"
        src="test-video.mp4"
        loop="true"
        muted
        playsinline
        webkit-playsinline
        crossorigin="anonymous"
        preload="auto">
      </video>
    </a-assets>

    <a-marker type="barcode" value="1" id="barcode-marker">
      <!-- Plane driven by custom video-texture component compatible with A-Frame 1.6.0 -->
      <a-plane
        video-texture
        position="0 0.1 0"
        rotation="-90 0 0"
        width="1.6"
        height="0.9">
      </a-plane>
    </a-marker>

    <a-entity camera></a-entity>
  </a-scene>

  <script>
    // Custom component optimized for A-Frame 1.6.0 & Three.js texture updates
    AFRAME.registerComponent('video-texture', {
      init: function () {
        this.videoEl = document.querySelector('#ar-video');
        
        // Create Three.js Video Texture
        this.texture = new THREE.VideoTexture(this.videoEl);
        this.texture.minFilter = THREE.LinearFilter;
        this.texture.magFilter = THREE.LinearFilter;
        this.texture.colorSpace = THREE.SRGBColorSpace; // Updated color space handling for A-Frame 1.6.0

        this.material = new THREE.MeshBasicMaterial({
          map: this.texture,
          side: THREE.DoubleSide
        });

        // Wait for A-Frame 1.6.0 to build the internal mesh geometry
        this.el.addEventListener('object3dset', (evt) => {
          if (evt.detail.type === 'mesh') {
            evt.detail.object.material = this.material;
          }
        });

        // Apply immediately if mesh is already constructed
        const mesh = this.el.getObject3D('mesh');
        if (mesh) {
          mesh.material = this.material;
        }
      },
      
      tick: function () {
        // Ensure texture frame updates when video plays
        if (this.videoEl && this.videoEl.readyState >= this.videoEl.HAVE_CURRENT_DATA) {
          this.texture.needsUpdate = true;
        }
      }
    });

    const overlay = document.getElementById('start-overlay');
    const startBtn = document.getElementById('start-btn');
    const video = document.getElementById('ar-video');
    const marker = document.getElementById('barcode-marker');

    startBtn.addEventListener('click', () => {
      overlay.style.display = 'none';
      video.play().catch(e => console.error("Video play error:", e));
    });

    marker.addEventListener('markerFound', () => {
      if (video.paused) {
        video.play();
      }
    });

    marker.addEventListener('markerLost', () => {
      video.pause();
    });
  </script>

</body>
</html>
