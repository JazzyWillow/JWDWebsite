<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Haunted Map AR</title>

  <!-- Core Open-Source Libraries -->
  <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
  
  <!-- Meshopt Decoder -->
  <script src="https://unpkg.com/meshoptimizer@0.18.1/meshopt_decoder.js"></script>
  
  <!-- Register Meshopt with A-Frame's GLTF Loader -->
  <script>
    THREE.GLTFLoader.MAX_INFLUENCES = 8;
    AFrame.registerComponent('meshopt-support', {
      init: function () {
        this.el.sceneEl.systems['gltf-model'].getGLTFLoader().setMeshoptDecoder(MeshoptDecoder);
      }
    });
  </script>

  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar-nft.js"></script>

  <style>
    .arjs-loader {
      height: 100%;
      width: 100%;
      position: absolute;
      top: 0;
      left: 0;
      background-color: rgba(0, 0, 0, 0.85);
      z-index: 9999;
      display: flex;
      justify-content: center;
      align-items: center;
      color: #ffffff;
      font-family: sans-serif;
      font-size: 1.2rem;
    }
  </style>
</head>

<body style="margin: 0px; overflow: hidden;">

  <!-- Loading Screen -->
  <div class="arjs-loader">
    <div>Loading Haunted Map Tracking...</div>
  </div>

  <a-scene
    vr-mode-ui="enabled: false;"
    renderer="logarithmicDepthBuffer: true;"
    embedded
    meshopt-support
    arjs="trackingMethod: best; sourceType: webcam; debugUIEnabled: false;">

    <a-assets>
      <a-asset-item id="ghostModel" src="./ghost-meshopt.glb"></a-asset-item>
    </a-assets>

    <!-- Absolute path pointing to the subfolder files -->
    <a-nft
  type="nft"
  url="/haunted-florida-ar/haunted-florida-ar"
  smooth="true"
  smoothCount="10"
  smoothTolerance=".01"
  smoothThreshold="5">

  <!-- Raised & Scaled Test Box -->
  <!-- Z-position raised so it floats directly above the tracking plane -->
  <a-box 
    position="50 50 0" 
    scale="100 100 100" 
    material="color: red; opacity: 0.9;">
  </a-box>

  <!-- 3D Ghost Model Entity -->
  <a-entity
    gltf-model="#ghostModel"
    scale="50 50 50"
    position="50 0 0"
    rotation="-90 0 0">
  </a-entity>

</a-nft>

    <a-entity camera></a-entity>

  </a-scene>

  <script>
    window.addEventListener("arjs-nft-loaded", () => {
      document.querySelector(".arjs-loader").style.display = "none";
    });
  </script>

</body>
</html>
