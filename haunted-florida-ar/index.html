<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, user-scalable=no"
  >

  <title>Haunted Florida AR</title>


  <!-- ========================================================= -->
  <!-- ERUDA MOBILE DEBUGGER                                     -->
  <!-- ========================================================= -->

  <script src="https://cdn.jsdelivr.net/npm/eruda"></script>

  <script>
    eruda.init();
  </script>


  <!-- ========================================================= -->
  <!-- A-FRAME 1.6.0                                            -->
  <!-- ========================================================= -->

  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>


  <!-- ========================================================= -->
  <!-- AR.JS 3.4.8 - NFT / IMAGE TRACKING                       -->
  <!-- ========================================================= -->

  <script src="https://raw.githack.com/AR-js-org/AR.js/3.4.8/aframe/build/aframe-ar-nft.js"></script>


  <!-- ========================================================= -->
  <!-- PAGE STYLING                                              -->
  <!-- ========================================================= -->

  <style>

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    .arjs-loader {
      height: 100%;
      width: 100%;

      position: absolute;

      top: 0;
      left: 0;

      background-color: rgba(0, 0, 0, 0.85);

      z-index: 9999;

      display: flex;

      justify-content: center;
      align-items: center;

      color: #ffffff;

      font-family: sans-serif;

      font-size: 1.2rem;

      text-align: center;
    }

  </style>

</head>


<body>


  <!-- ========================================================= -->
  <!-- LOADING SCREEN                                            -->
  <!-- ========================================================= -->

  <div class="arjs-loader">

    <div>
      Loading Haunted Florida Tracking...
    </div>

  </div>


  <!-- ========================================================= -->
  <!-- A-FRAME SCENE                                             -->
  <!-- ========================================================= -->

  <a-scene

    vr-mode-ui="enabled: false"

    renderer="
      logarithmicDepthBuffer: true;
      precision: medium;
    "

    embedded

    gltf-model="
      meshoptDecoderPath:
      https://unpkg.com/meshoptimizer@0.18.1/meshopt_decoder.cjs;
    "

    arjs="
      trackingMethod: best;
      sourceType: webcam;
      debugUIEnabled: false;
    "

  >


    <!-- ======================================================= -->
    <!-- ASSETS                                                   -->
    <!-- ======================================================= -->

    <a-assets>

      <a-asset-item
        id="ghostModel"
        src="./ghost-meshopt.glb"
      ></a-asset-item>

    </a-assets>


    <!-- ======================================================= -->
    <!-- HAUNTED FLORIDA NFT TARGET                               -->
    <!-- ======================================================= -->

    <a-nft

      type="nft"

      url="/haunted-florida-ar/haunted-florida-ar"

      smooth="true"

      smoothCount="10"

      smoothTolerance="0.01"

      smoothThreshold="5"

    >


      <!-- ===================================================== -->
      <!-- RED TEST BOX                                           -->
      <!-- ===================================================== -->

      <a-box

        position="0 0 0"

        scale="50 50 50"

        material="
          color: red;
          opacity: 0.8;
          transparent: true;
        "

      ></a-box>


      <!-- ===================================================== -->
      <!-- GHOST MODEL                                            -->
      <!-- ===================================================== -->

      <a-entity

        id="ghostEntity"

        gltf-model="#ghostModel"

        scale="20 20 20"

        position="0 0 0"

        rotation="-90 0 0"

      ></a-entity>


    </a-nft>


    <!-- ======================================================= -->
    <!-- CAMERA                                                   -->
    <!-- ======================================================= -->

    <a-entity camera></a-entity>


  </a-scene>


  <!-- ========================================================= -->
  <!-- DEBUG / EVENT MONITORING                                  -->
  <!-- ========================================================= -->

  <script>

    /*
     * Wait until the page has finished creating the A-Frame
     * elements before attaching our diagnostic listeners.
     */

    window.addEventListener("DOMContentLoaded", () => {

      const loader =
        document.querySelector(".arjs-loader");

      const nft =
        document.querySelector("a-nft");

      const ghostEntity =
        document.querySelector("#ghostEntity");

      const ghostAsset =
        document.querySelector("#ghostModel");


      /* ======================================================= */
      /* A-FRAME SCENE LOADED                                    */
      /* ======================================================= */

      const scene =
        document.querySelector("a-scene");

      scene.addEventListener("loaded", () => {

        console.log(
          "***** A-FRAME SCENE LOADED *****"
        );

        console.log(
          "A-Frame version:",
          AFRAME.version
        );

      });


      /* ======================================================= */
      /* GHOST ASSET LOADED                                      */
      /* ======================================================= */

      ghostAsset.addEventListener("loaded", () => {

        console.log(
          "***** GHOST ASSET LOADED *****"
        );

      });


      /* ======================================================= */
      /* GHOST ASSET ERROR                                       */
      /* ======================================================= */

      ghostAsset.addEventListener("error", (event) => {

        console.error(
          "***** GHOST ASSET ERROR *****",
          event
        );

      });


      /* ======================================================= */
      /* GHOST MODEL SUCCESSFULLY LOADED                         */
      /* ======================================================= */

      ghostEntity.addEventListener("model-loaded", (event) => {

        console.log(
          "***** GHOST MODEL LOADED SUCCESSFULLY *****"
        );

        console.log(
          "Ghost model details:",
          event
        );

      });


      /* ======================================================= */
      /* GHOST MODEL ERROR                                       */
      /* ======================================================= */

      ghostEntity.addEventListener("model-error", (event) => {

        console.error(
          "***** GHOST MODEL ERROR *****",
          event
        );

      });


      /* ======================================================= */
      /* NFT TARGET FOUND                                        */
      /* ======================================================= */

      nft.addEventListener("targetFound", () => {

        console.log(
          "***** HAUNTED FLORIDA TARGET FOUND *****"
        );

        if (loader) {
          loader.style.display = "none";
        }

      });


      /* ======================================================= */
      /* NFT TARGET LOST                                         */
      /* ======================================================= */

      nft.addEventListener("targetLost", () => {

        console.log(
          "***** HAUNTED FLORIDA TARGET LOST *****"
        );

      });


      /* ======================================================= */
      /* NFT DESCRIPTORS LOADED                                  */
      /* ======================================================= */

      window.addEventListener(
        "arjs-nft-loaded",
        () => {

          console.log(
            "***** NFT DESCRIPTORS LOADED *****"
          );

        }
      );


      /* ======================================================= */
      /* NFT INITIALIZATION DATA                                 */
      /* ======================================================= */

      window.addEventListener(
        "arjs-nft-init-data",
        (event) => {

          console.log(
            "***** NFT INIT DATA *****",
            event.detail
          );

        }
      );


    });

  </script>


</body>

</html>
