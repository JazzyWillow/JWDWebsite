<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Haunted Map AR</title>

  <!-- Core Open-Source Libraries (Non-AI) -->
  <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar-nft.js"></script>

  <style>
    /* Loading overlay shown while tracking descriptors parse in memory */
    .arjs-loader {
      height: 100%;
      width: 100%;
      position: absolute;
      top: 0;
      left: 0;
      background-color: rgba(0, 0, 0, 0.85);
      z-index: 9999;
      display: flex;
      justify-content: center;
      align-items: center;
      color: #ffffff;
      font-family: sans-serif;
      font-size: 1.2rem;
    }
  </style>
</head>

<body style="margin: 0px; overflow: hidden;">

  <!-- Loading Screen -->
  <div class="arjs-loader">
    <div>Loading Haunted Map Tracking...</div>
  </div>

  <a-scene
    vr-mode-ui="enabled: false;"
    renderer="logarithmicDepthBuffer: true;"
    embedded
    arjs="trackingMethod: best; sourceType: webcam; debugUIEnabled: false;">

    <a-assets>
      <!-- Preload the GLB model asset -->
      <a-asset-item id="ghostModel" src="./ghost.glb"></a-asset-item>
    </a-assets>

    <!-- 
      NFT Tracking Target:
      Notice url="./map-window" HAS NO EXTENSION. 
      AR.js automatically appends .iset, .fset, and .fset3 internally.
    -->
    <a-nft
      type="nft"
      url="./haunted-florida-ar"
      smooth="true"
      smoothCount="10"
      smoothTolerance=".01"
      smoothThreshold="5">

      <!-- 3D Ghost Model Entity -->
      <a-entity
        gltf-model="#ghostModel"
        scale="10 10 10"
        position="50 0 -10"
        rotation="-90 0 0">
      </a-entity>

    </a-nft>

    <!-- Virtual Camera -->
    <a-entity camera></a-entity>

  </a-scene>

  <script>
    // Hide the loader screen once the camera and NFT target descriptors finish initializing
    window.addEventListener("arjs-nft-loaded", () => {
      document.querySelector(".arjs-loader").style.display = "none";
    });
  </script>

</body>
</html>
