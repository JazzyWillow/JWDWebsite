<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <title>Haunted Florida AR</title>

  <!-- Eruda mobile console -->
  <script src="https://cdn.jsdelivr.net/npm/eruda"></script>
  <script>
    eruda.init();
  </script>

  <!-- A-Frame 1.6.0 -->
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>

  <!-- AR.js 3.4.8 -->
  <script src="https://raw.githack.com/AR-js-org/AR.js/3.4.8/aframe/build/aframe-ar-nft.js"></script>

  <!-- Ghost model diagnostics -->
  <script>
    AFRAME.registerComponent('ghost-debug', {

      init: function () {

        console.log("***** GHOST ENTITY INITIALIZED *****");

        this.el.addEventListener('model-loaded', function (event) {
          console.log(
            "***** GHOST MODEL LOADED SUCCESSFULLY *****",
            event
          );
        });

        this.el.addEventListener('model-error', function (event) {
          console.error(
            "***** GHOST MODEL ERROR *****",
            event
          );
        });

      }

    });
  </script>

</head>

<body style="margin: 0; overflow: hidden;">

  <a-scene
    vr-mode-ui="enabled: false"

    renderer="
      logarithmicDepthBuffer: true;
      precision: medium;
    "

    embedded

    gltf-model="
      meshoptDecoderPath: https://unpkg.com/meshoptimizer@0.18.1/meshopt_decoder.cjs;
    "

    arjs="
      trackingMethod: best;
      sourceType: webcam;
      debugUIEnabled: false;
    "
  >

    <!--
      ============================================================
      HAUNTED FLORIDA NFT TARGET
      ============================================================
    -->

    <a-nft
      id="hauntedFloridaTarget"

      type="nft"

      url="/haunted-florida-ar/haunted-florida-ar"

      smooth="true"
      smoothCount="10"
      smoothTolerance="0.01"
      smoothThreshold="5"
    >

      <!--
        ==========================================================
        GHOST MODEL

        Loaded directly instead of through <a-assets>.
        ==========================================================
      -->

      <a-entity
        id="ghostEntity"

        ghost-debug

        gltf-model="url(./ghost-meshopt.glb)"

        scale="20 20 20"

        position="0 0 0"

        rotation="-90 0 0"
      >
      </a-entity>

      <!--
        Temporary red diagnostic box.

        If the NFT target is detected, this should appear even
        if the ghost itself has a loading/visibility problem.
      -->

      <a-box
        id="debugBox"

        position="0 0 0"

        scale="150 150 150"

        color="red"

        opacity="0.25"
      >
      </a-box>

    </a-nft>


    <!-- Camera -->

    <a-entity camera></a-entity>

  </a-scene>


  <!-- ============================================================
       ADDITIONAL DIAGNOSTICS
       ============================================================ -->

  <script>

    document.addEventListener('DOMContentLoaded', function () {

      console.log("***** DOM CONTENT LOADED *****");


      const scene = document.querySelector('a-scene');

      const nft = document.querySelector('#hauntedFloridaTarget');

      const ghost = document.querySelector('#ghostEntity');


      /*
       * Scene loaded
       */

      scene.addEventListener('loaded', function () {

        console.log("***** A-FRAME SCENE LOADED *****");

      });


      /*
       * NFT initialization
       */

      nft.addEventListener('loaded', function () {

        console.log("***** NFT INIT DATA *****");

      });


      /*
       * NFT target found
       */

      nft.addEventListener('targetFound', function () {

        console.log(
          "***** HAUNTED FLORIDA TARGET FOUND *****"
        );

      });


      /*
       * NFT target lost
       */

      nft.addEventListener('targetLost', function () {

        console.log(
          "***** HAUNTED FLORIDA TARGET LOST *****"
        );

      });


      /*
       * Additional ghost diagnostics.
       *
       * These are intentionally attached immediately after
       * DOMContentLoaded as a backup to the ghost-debug component.
       */

      ghost.addEventListener('model-loaded', function (event) {

        console.log(
          "***** BACKUP: GHOST MODEL LOADED *****",
          event
        );

      });


      ghost.addEventListener('model-error', function (event) {

        console.error(
          "***** BACKUP: GHOST MODEL ERROR *****",
          event
        );

      });


      /*
       * Watch for the NFT descriptor loading.
       */

      window.addEventListener('arjs-nft-loaded', function (event) {

        console.log(
          "***** NFT DESCRIPTORS LOADED *****",
          event
        );

      });


      console.log("***** DIAGNOSTIC LISTENERS INSTALLED *****");

    });

  </script>

</body>
</html>
