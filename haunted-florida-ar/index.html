<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, user-scalable=no"
  >

  <title>Haunted Florida AR</title>


  <!-- ========================================================= -->
  <!-- ERUDA MOBILE DEBUGGER                                     -->
  <!-- ========================================================= -->

  <script src="https://cdn.jsdelivr.net/npm/eruda"></script>

  <script>
    eruda.init();
  </script>


  <!-- ========================================================= -->
  <!-- A-FRAME                                                   -->
  <!-- ========================================================= -->

  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>


  <!-- ========================================================= -->
  <!-- AR.JS 3.4.8 - NFT / IMAGE TRACKING                       -->
  <!-- ========================================================= -->

  <script src="https://raw.githack.com/AR-js-org/AR.js/3.4.8/aframe/build/aframe-ar-nft.js"></script>


  <!-- ========================================================= -->
  <!-- PAGE STYLING                                              -->
  <!-- ========================================================= -->

  <style>

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    .arjs-loader {
      height: 100%;
      width: 100%;

      position: absolute;

      top: 0;
      left: 0;

      background-color: rgba(0, 0, 0, 0.85);

      z-index: 9999;

      display: flex;

      justify-content: center;
      align-items: center;

      color: #ffffff;

      font-family: sans-serif;

      font-size: 1.2rem;

      text-align: center;
    }

  </style>

</head>


<body>


  <!-- ========================================================= -->
  <!-- LOADING SCREEN                                            -->
  <!-- ========================================================= -->

  <div class="arjs-loader">

    <div>
      Loading Haunted Florida Tracking...
    </div>

  </div>


  <!-- ========================================================= -->
  <!-- A-FRAME SCENE                                             -->
  <!-- ========================================================= -->

  <a-scene

    vr-mode-ui="enabled: false"

    renderer="
      logarithmicDepthBuffer: true;
      precision: medium;
    "

    embedded

    gltf-model="
      meshoptDecoderPath:
      https://unpkg.com/meshoptimizer@0.19.0/meshopt_decoder.js;
    "

    arjs="
      trackingMethod: best;
      sourceType: webcam;
      debugUIEnabled: false;
    "

  >


    <!-- ======================================================= -->
    <!-- ASSETS                                                   -->
    <!-- ======================================================= -->

    <a-assets>

      <a-asset-item
        id="ghostModel"
        src="./ghost-meshopt.glb"
      ></a-asset-item>

    </a-assets>


    <!-- ======================================================= -->
    <!-- HAUNTED FLORIDA NFT TARGET                               -->
    <!-- ======================================================= -->

    <a-nft

      type="nft"

      url="/haunted-florida-ar/haunted-florida-ar"

      smooth="true"

      smoothCount="10"

      smoothTolerance="0.01"

      smoothThreshold="5"

    >


      <!-- ===================================================== -->
      <!-- RED TEST BOX                                           -->
      <!-- ===================================================== -->

      <a-box

        position="0 0 0"

        scale="50 50 50"

        material="
          color: red;
          opacity: 0.8;
        "

      ></a-box>


      <!-- ===================================================== -->
      <!-- GHOST MODEL                                            -->
      <!-- ===================================================== -->

      <a-entity

        gltf-model="#ghostModel"

        scale="20 20 20"

        position="0 0 0"

        rotation="-90 0 0"

      ></a-entity>


    </a-nft>


    <!-- ======================================================= -->
    <!-- CAMERA                                                   -->
    <!-- ======================================================= -->

    <a-entity camera></a-entity>


  </a-scene>


  <!-- ========================================================= -->
  <!-- DEBUG / EVENT MONITORING                                  -->
  <!-- ========================================================= -->

  <script>

    const loader =
      document.querySelector(".arjs-loader");

    const nft =
      document.querySelector("a-nft");

    const ghost =
      document.querySelector("#ghostModel");


    /*
     * ----------------------------------------------------------
     * NFT TARGET FOUND
     * ----------------------------------------------------------
     */

    nft.addEventListener("targetFound", () => {

      console.log(
        "***** HAUNTED FLORIDA TARGET FOUND *****"
      );

      if (loader) {
        loader.style.display = "none";
      }

    });


    /*
     * ----------------------------------------------------------
     * NFT TARGET LOST
     * ----------------------------------------------------------
     */

    nft.addEventListener("targetLost", () => {

      console.log(
        "***** HAUNTED FLORIDA TARGET LOST *****"
      );

    });


    /*
     * ----------------------------------------------------------
     * GHOST MODEL LOADED
     * ----------------------------------------------------------
     */

    ghost.addEventListener("model-loaded", () => {

      console.log(
        "***** GHOST MODEL LOADED SUCCESSFULLY *****"
      );

    });


    /*
     * ----------------------------------------------------------
     * GHOST MODEL ERROR
     * ----------------------------------------------------------
     */

    ghost.addEventListener("model-error", (event) => {

      console.error(
        "***** GHOST MODEL ERROR *****",
        event
      );

    });


    /*
     * ----------------------------------------------------------
     * NFT LOADED
     * ----------------------------------------------------------
     */

    window.addEventListener(
      "arjs-nft-loaded",
      () => {

        console.log(
          "***** NFT DESCRIPTORS LOADED *****"
        );

      }
    );


    /*
     * ----------------------------------------------------------
     * GENERAL A-FRAME LOADED
     * ----------------------------------------------------------
     */

    document.querySelector("a-scene")
      .addEventListener("loaded", () => {

        console.log(
          "***** A-FRAME SCENE LOADED *****"
        );

      });

  </script>


</body>

</html>
