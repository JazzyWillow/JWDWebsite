<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Haunted Map AR</title>

  <!-- Eruda Mobile Debugger (Optional) -->
  <script src="https://cdn.jsdelivr.net/npm/eruda"></script>
  <script>eruda.init();</script>

  <!-- 1. Core A-Frame Library -->
  <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>

  <!-- 2. Meshopt Decoder Script -->
  <script src="https://unpkg.com/meshoptimizer@0.18.1/meshopt_decoder.js"></script>

  <!-- 3. Register Meshopt Component (After A-Frame is loaded) -->
  <script>
    AFRAME.registerComponent('meshopt-support', {
      init: function () {
        const loader = this.el.sceneEl.systems['gltf-model'].getGLTFLoader();
        if (typeof MeshoptDecoder !== 'undefined') {
          loader.setMeshoptDecoder(MeshoptDecoder);
        }
      }
    });
  </script>

  <!-- 4. AR.js Library -->
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar-nft.js"></script>

  <style>
    .arjs-loader {
      height: 100%;
      width: 100%;
      position: absolute;
      top: 0;
      left: 0;
      background-color: rgba(0, 0, 0, 0.85);
      z-index: 9999;
      display: flex;
      justify-content: center;
      align-items: center;
      color: #ffffff;
      font-family: sans-serif;
      font-size: 1.2rem;
    }
  </style>
</head>

<body style="margin: 0px; overflow: hidden;">

  <!-- Loading Screen -->
  <div class="arjs-loader">
    <div>Loading Haunted Map Tracking...</div>
  </div>

  <a-scene
    vr-mode-ui="enabled: false;"
    renderer="logarithmicDepthBuffer: true;"
    embedded
    meshopt-support
    arjs="trackingMethod: best; sourceType: webcam; debugUIEnabled: false;">

    <a-assets>
      <a-asset-item id="ghostModel" src="./ghost-meshopt.glb"></a-asset-item>
    </a-assets>

    <a-nft
      type="nft"
      url="/haunted-florida-ar/haunted-florida-ar"
      smooth="true"
      smoothCount="10"
      smoothTolerance=".01"
      smoothThreshold="5">

      <!-- Test Red Box centered over tracking origin -->
      <a-box 
        position="0 0 0" 
        scale="150 150 150" 
        material="color: red; opacity: 0.8;">
      </a-box>

      <!-- 3D Ghost Model Entity -->
      <a-entity
        gltf-model="#ghostModel"
        scale="20 20 20"
        position="0 0 0"
        rotation="-90 0 0">
      </a-entity>

    </a-nft>

    <a-entity camera></a-entity>

  </a-scene>

  <script>
    window.addEventListener("arjs-nft-loaded", () => {
      const loader = document.querySelector(".arjs-loader");
      if (loader) {
        loader.style.display = "none";
      }
      console.log("NFT Loaded Successfully!");
    });
  </script>

</body>
</html>
