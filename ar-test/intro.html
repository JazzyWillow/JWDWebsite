<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Responsive Video Player</title>
  <style>
    /* Base setup */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body, html {
      width: 100%;
      height: 100%;
      background-color: #0d0d0d;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* Video Player Wrapper */
    .player-wrapper {
      position: relative;
      width: 100%;
      max-width: 900px; /* Constrains width on desktop browsers */
      background: #000;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
    }

    /* Video Element */
    video {
      width: 100%;
      height: auto;
      display: block;
      object-fit: contain; /* Keeps original aspect ratio without cropping */
    }

    /* Mobile view: Expand to cover full screen */
    @media (max-width: 768px) {
      body, html {
        overflow: hidden;
      }
      .player-wrapper {
        max-width: 100%;
        height: 100%;
        border-radius: 0;
        display: flex;
        align-items: center;
      }
      video {
        height: 100%;
        object-fit: cover; /* Cover full screen on phone screens */
      }
    }
  </style>
</head>
<body>

  <div class="player-wrapper">
    <!-- 
      - controls: Shows native browser controls (play, pause, volume, scrub bar, full-screen)
      - playsinline: Required for inline full-screen playback on mobile safari/iOS
    -->
    <video 
      id="myVideo" 
      src="assets/intro.mp4" 
      controls 
      playsinline 
      preload="metadata">
      Your browser does not support HTML5 video.
    </video>
  </div>

</body>
</html>
