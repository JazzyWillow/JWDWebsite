<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!-- Ensure proper scaling on mobile devices -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>FloridaRAMA Field Research Archives</title>
  <style>
    /* Reset default styling */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #000;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    /* Container to hold and center the video */
    .video-container {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* Video element styled to cover full screen smoothly */
    video {
      width: 100%;
      height: 100%;
      object-fit: cover; /* Covers screen without stretching aspect ratio */
      display: block;
    }

    /* Custom Unmute / Play Overlay Button */
    .overlay-btn {
      position: absolute;
      bottom: 40px;
      padding: 12px 24px;
      font-size: 16px;
      font-weight: 600;
      color: #fff;
      background-color: rgba(0, 0, 0, 0.65);
      border: 1px solid rgba(255, 255, 255, 0.3);
      border-radius: 30px;
      backdrop-filter: blur(8px);
      cursor: pointer;
      transition: all 0.2s ease;
      z-index: 10;
    }

    .overlay-btn:active {
      transform: scale(0.95);
      background-color: rgba(0, 0, 0, 0.85);
    }
  </style>
</head>
<body>

  <div class="video-container">
    <!-- 
      - playsinline: Critical for iOS Safari to keep video full-screen in browser instead of forcing native player
      - autoplay & muted: Required by mobile browsers for auto-playback without explicit user gesture
    -->
    <video 
      id="myVideo" 
      src="assets/intro.mp4" 
      autoplay 
      muted 
      loop 
      playsinline>
      Your browser does not support HTML5 video.
    </video>

    <!-- Tap to Unmute / Play Button -->
    <button id="toggleAudioBtn" class="overlay-btn">Tap for Sound 🔊</button>
  </div>

  <script>
    const video = document.getElementById('myVideo');
    const toggleAudioBtn = document.getElementById('toggleAudioBtn');

    // Attempt autoplay when page loads
    window.addEventListener('load', () => {
      video.play().catch(error => {
        console.log("Autoplay prevented:", error);
      });
    });

    // Handle Unmute/Mute Toggle
    toggleAudioBtn.addEventListener('click', () => {
      if (video.muted) {
        video.muted = false;
        toggleAudioBtn.textContent = 'Mute Sound 🔇';
      } else {
        video.muted = true;
        toggleAudioBtn.textContent = 'Tap for Sound 🔊';
      }
    });

    // Tap video background to pause/play
    video.addEventListener('click', () => {
      if (video.paused) {
        video.play();
      } else {
        video.paused;
      }
    });
  </script>

</body>
</html>
