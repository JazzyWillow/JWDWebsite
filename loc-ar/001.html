<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NFC AR Clue - Green Screen 2</title>
  
  <!-- A-Frame and AR.js Libraries -->
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar-nft.js"></script>
  <script src="https://unpkg.com/aframe-look-at-component@0.8.0/dist/aframe-look-at-component.min.js"></script>
  
  <!-- A-Frame Chroma Key Shader for Green Screen Removal -->
  <script src="https://unpkg.com/aframe-chromakey-material/dist/aframe-chromakey-material.min.js"></script>

  <style>
    /* Fullscreen UI Overlay to satisfy mobile browser autoplay policy */
    #start-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: rgba(0, 0, 0, 0.85);
      z-index: 9999;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      color: white;
      font-family: sans-serif;
    }

    #start-btn {
      padding: 15px 30px;
      font-size: 18px;
      font-weight: bold;
      color: #fff;
      background-color: #007bff;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      margin-top: 20px;
    }
  </style>
</head>
<body style="margin: 0; overflow: hidden;">

  <!-- ========================================================= -->
  <!-- CONFIGURATION VARIABLES (Edit these for each NFC page)     -->
  <!-- ========================================================= -->
  <script>
    const CONFIG = {
      videoSrc: 'assets/specimen001.mp4', // Fixed typo (specimen001.mp4)
      latitude: 28.310221,                
      longitude: -82.671417,               
      
      // Material & Positioning
      chromaColor: '0.1 0.9 0.1',  // Green screen key color RGB (0.0 to 1.0 scale)
      position: '0 0.1 0',        // Relative position
      rotation: '0 0 0',           // Rotation (0 0 0 keeps video facing upright)
      scale: '3 3 3',           // Scale multiplier
      width: 1.6,                  // Width of plane
      height: 0.9                  // Height of plane
    };
  </script>
  <!-- ========================================================= -->

  <!-- Tap-to-Start Screen -->
  <div id="start-overlay">
    <h2>Tap to Start AR</h2>
    <p>Camera and video access required</p>
    <button id="start-btn">Start Experience</button>
  </div>

  <a-scene
    vr-mode-ui="enabled: false"
    embedded
    arjs="sourceType: webcam; debugUIEnabled: false;">

    <a-assets>
      <!-- Green screen video asset -->
      <video 
        id="greenscreen-video" 
        preload="auto" 
        loop 
        crossorigin="anonymous" 
        playsinline 
        webkit-playsinline
        muted>
      </video>
    </a-assets>

    <!-- Camera element with explicit ID -->
    <a-camera 
      id="main-camera"
      gps-camera="minDistance: 1; positionMinAccuracy: 1000; alert: false;" 
      rotation-reader>
    </a-camera>

    <!-- Parent GPS Entity (Anchors scene to target lat/long) -->
    <a-entity id="ar-location-node">
      
      <!-- Child Plane with Chromakey Shader & Look-At targeting main camera -->
      <a-plane 
        id="clue-plane"
        look-at="#main-camera">
      </a-plane>

    </a-entity>

  </a-scene>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const videoEl = document.querySelector('#greenscreen-video');
      const locationNode = document.querySelector('#ar-location-node');
      const planeEl = document.querySelector('#clue-plane');
      const overlay = document.querySelector('#start-overlay');
      const startBtn = document.querySelector('#start-btn');

      // Set video source
      videoEl.setAttribute('src', CONFIG.videoSrc);

      // Set GPS location on the parent node
      locationNode.setAttribute('gps-entity-place', `latitude: ${CONFIG.latitude}; longitude: ${CONFIG.longitude};`);

      // Apply transforms and chromakey shader to child plane
      planeEl.setAttribute('material', `shader: chromakey; src: #greenscreen-video; color: ${CONFIG.chromaColor};`);
      planeEl.setAttribute('position', CONFIG.position);
      planeEl.setAttribute('rotation', CONFIG.rotation);
      planeEl.setAttribute('scale', CONFIG.scale);
      planeEl.setAttribute('width', CONFIG.width);
      planeEl.setAttribute('height', CONFIG.height);

      // Start experience on user interaction
      const startExperience = () => {
        videoEl.muted = false;
        videoEl.play().then(() => {
          overlay.style.display = 'none';
        }).catch((err) => {
          console.warn('Playback failed:', err);
        });
      };

      startBtn.addEventListener('click', startExperience);
    });
  </script>
</body>
</html>
