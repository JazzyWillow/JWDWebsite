<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NFC AR Clue</title>
  
  <!-- A-Frame and AR.js Libraries -->
  <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar-nft.js"></script>
  <script src="https://unpkg.com/aframe-look-at-component@0.8.0/dist/aframe-look-at-component.min.js"></script>
</head>
<body style="margin: 0; overflow: hidden;">

  <!-- ========================================================= -->
  <!-- CONFIGURATION VARIABLES (Edit these for each NFC page)     -->
  <!-- ========================================================= -->
  <script>
    const CONFIG = {
      videoSrc: 'assets/speciment001.mp4',       // Path or URL to your MP4 file
      latitude: 28.310221,         // Lucy
      longitude: -82.671417        // 
    };
  </script>
  <!-- ========================================================= -->

  <a-scene
    vr-mode-ui="enabled: false"
    embedded
    arjs="sourceType: webcam; debugUIEnabled: false;">

    <a-assets>
      <!-- Video Element populated dynamically from CONFIG -->
      <video 
        id="clue-video" 
        preload="auto" 
        loop 
        crossorigin="anonymous" 
        playsinline 
        webkit-playsinline>
      </video>
    </a-assets>

    <!-- Camera with High-Accuracy GPS Settings -->
    <a-camera 
      gps-camera="minDistance: 1; positionMinAccuracy: 1000; alert: false;" 
      rotation-reader>
    </a-camera>

    <!-- AR Location Entity populated dynamically from CONFIG -->
    <a-entity id="ar-target" position="0 0 0">
      <a-video 
        src="#clue-video" 
        width="2" 
        height="1.125" 
        look-at="[gps-camera]">
      </a-video>
    </a-entity>

  </a-scene>

  <script>
    // Inject variable values into the A-Frame elements
    document.addEventListener('DOMContentLoaded', () => {
      const videoEl = document.querySelector('#clue-video');
      const targetEntity = document.querySelector('#ar-target');

      // Set video source
      videoEl.setAttribute('src', CONFIG.videoSrc);

      // Set GPS location coordinates
      targetEntity.setAttribute('gps-entity-place', `latitude: ${CONFIG.latitude}; longitude: ${CONFIG.longitude};`);
    });

    // Tap anywhere on screen to trigger video playback (required for mobile autoplay policies)
    window.addEventListener('click', () => {
      const video = document.querySelector('#clue-video');
      if (video && video.paused) {
        video.play();
      }
    });
  </script>
</body>
</html>
