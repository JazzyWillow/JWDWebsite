<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NFC AR Clue - Camera Anchored</title>
  
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
  <script src="https://unpkg.com/aframe-chromakey-material/dist/aframe-chromakey-material.min.js"></script>

  <style>
    #start-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: rgba(0, 0, 0, 0.85);
      z-index: 9999;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      color: white;
      font-family: sans-serif;
    }

    #start-btn {
      padding: 15px 30px;
      font-size: 18px;
      font-weight: bold;
      color: #fff;
      background-color: #007bff;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      margin-top: 20px;
    }
  </style>
</head>
<body style="margin: 0; overflow: hidden;">

  <script>
    const CONFIG = {
      videoSrc: 'assets/specimen001.mp4', 
      chromaColor: '0.1 0.9 0.1', 
      position: '0 0 -3',        // Directly 3 meters in front of user's eye level
      scale: '1.6 0.9 1',         // Clean 16:9 proportional scale
      width: 1.6,                  
      height: 0.9                  
    };
  </script>

  <div id="start-overlay">
    <h2>Tap to Start AR</h2>
    <p>Camera access required</p>
    <button id="start-btn">Start Experience</button>
  </div>

  <a-scene
    vr-mode-ui="enabled: false"
    embedded
    arjs="sourceType: webcam; debugUIEnabled: false;">

    <a-assets>
      <video 
        id="greenscreen-video" 
        preload="auto" 
        loop 
        crossorigin="anonymous" 
        playsinline 
        webkit-playsinline
        muted>
      </video>
    </a-assets>

    <!-- Camera element -->
    <a-camera id="main-camera">
      <!-- Child Plane mounted inside camera coordinate space -->
      <a-plane 
        id="clue-plane">
      </a-plane>
    </a-camera>

  </a-scene>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const videoEl = document.querySelector('#greenscreen-video');
      const planeEl = document.querySelector('#clue-plane');
      const overlay = document.querySelector('#start-overlay');
      const startBtn = document.querySelector('#start-btn');

      videoEl.setAttribute('src', CONFIG.videoSrc);

      // Lock plane to local camera transform
      planeEl.setAttribute('material', `shader: chromakey; src: #greenscreen-video; color: ${CONFIG.chromaColor};`);
      planeEl.setAttribute('position', CONFIG.position);
      planeEl.setAttribute('scale', CONFIG.scale);
      planeEl.setAttribute('width', CONFIG.width);
      planeEl.setAttribute('height', CONFIG.height);

      startBtn.addEventListener('click', () => {
        videoEl.muted = false;
        videoEl.play().then(() => {
          overlay.style.display = 'none';
        }).catch((err) => {
          console.warn('Playback failed:', err);
        });
      });
    });
  </script>
</body>
</html>
