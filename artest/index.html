<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Haunted Map AR - Barcode Marker</title>

  <!-- Eruda Mobile Console -->
  <script src="https://cdn.jsdelivr.net/npm/eruda"></script>
  <script>eruda.init();</script>

  <!-- A-Frame 1.8.0 -->
  <script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>

  <!-- Modern AR.js -->
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
</head>

<body style="margin: 0px; overflow: hidden;">

  <!-- 
    detectionMode: mono_and_matrix turns on barcode parsing.
    matrixCodeType: 3x3 matches the generator setting.
  -->
  <a-scene 
    embedded 
    arjs="sourceType: webcam; debugUIEnabled: false; detectionMode: mono_and_matrix; matrixCodeType: 3x3;">

    <a-assets>
      <!-- Preload your model -->
      <a-asset-item id="ghostModel" src="./ghost-meshopt.glb"></a-asset-item>
    </a-assets>

    <!-- 
      type="barcode"
      value="5" corresponds to Barcode ID #5 from the generator
    -->
    <a-marker type="barcode" value="1">
      
      <!-- Red Test Box -->
      <a-box 
        position="0 0.5 0" 
        scale="1 1 1"
        material="color: red; opacity: 0.8;">
      </a-box>

      <!-- 3D Ghost Model -->
      <a-entity
        gltf-model="#ghostModel"
        scale="0.5 0.5 0.5"
        position="0 0 0"
        rotation="-90 0 0">
      </a-entity>

    </a-marker>

    <!-- Camera Entity -->
    <a-entity camera></a-entity>

  </a-scene>

</body>
</html>
