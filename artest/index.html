<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Haunted Map AR - Hiro Ghost & Test Cube</title>

  <!-- Eruda Mobile Console -->
  <script src="https://cdn.jsdelivr.net/npm/eruda"></script>
  <script>eruda.init();</script>

  <!-- A-Frame 1.8.0 -->
  <script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>

  <!-- Modern AR.js for A-Frame -->
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

  <!-- Meshopt Decoder library -->
  <script src="https://cdn.jsdelivr.net/npm/meshoptimizer@0.21.0/meshopt_decoder.js"></script>
</head>

<body style="margin: 0px; overflow: hidden;">

  <a-scene 
    embedded 
    gltf-model="meshoptDecoderPath: https://cdn.jsdelivr.net/npm/meshoptimizer@0.21.0/meshopt_decoder.js;"
    arjs="sourceType: webcam; debugUIEnabled: false;">

    <a-assets>
      <!-- Preload the compressed .glb asset -->
      <a-asset-item id="ghostModel" src="./ghost-meshopt.glb"></a-asset-item>
    </a-assets>

    <!-- Standard Hiro Marker -->
    <a-marker preset="hiro">
      
      <!-- Ambient light for clean texture visibility -->
      <a-entity light="type: ambient; color: #ffffff; intensity: 1.5;"></a-entity>

      <!-- Red Test Cube (placed at center height 0.5) -->
      <a-box 
        position="0 0.5 0" 
        scale="0.5 0.5 0.5"
        material="color: red; opacity: 0.8;">
      </a-box>

      <!-- 3D Ghost Model -->
      <a-entity
        gltf-model="#ghostModel"
        position="0 0 0"
        rotation="0 0 0"
        scale="0.5 0.5 0.5">
      </a-entity>

    </a-marker>

    <!-- Camera -->
    <a-entity camera></a-entity>

  </a-scene>

</body>
</html>
