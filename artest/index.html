<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <title>Haunted Florida AR</title>

  <!-- Eruda mobile console -->
  <script src="https://cdn.jsdelivr.net/npm/eruda"></script>
  <script>eruda.init();</script>

  <!-- 1. Modern A-Frame 1.8.0 -->
  <script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>

  <!-- 2. Official AR.js maintained build for A-Frame -->
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
</head>

<body style="margin: 0px; overflow: hidden;">

  <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;">

    <!-- Define the Hiro Marker Target -->
    <a-marker preset="hiro">
      <!-- The red semi-transparent test cube -->
      <a-box 
        position="0 0.5 0" 
        material="color: red; opacity: 0.7;"
        scale="1 1 1">
      </a-box>
    </a-marker>

    <!-- Static Camera Entity (Required for modern A-Frame) -->
    <a-entity camera></a-entity>

  </a-scene>

</body>
</html>
