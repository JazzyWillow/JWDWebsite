<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Haunted Map AR - Meshopt Ghost</title>

  <!-- Eruda Mobile Console -->
  <script src="https://cdn.jsdelivr.net/npm/eruda"></script>
  <script>eruda.init();</script>

  <!-- A-Frame 1.8.0 -->
  <script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>

  <!-- Modern AR.js -->
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

  <!-- Load Meshopt Decoder library before scene initializes -->
  <script src="https://cdn.jsdelivr.net/npm/meshoptimizer@0.21.0/meshopt_decoder.js"></script>
</head>

<body style="margin: 0px; overflow: hidden;">

  <!-- 
    gltf-model="meshoptDecoderPath: ..." tells Three.js where to fetch the decoder for compressed GLBs
  -->
  <a-scene 
    embedded 
    gltf-model="meshoptDecoderPath: https://cdn.jsdelivr.net/npm/meshoptimizer@0.21.0/meshopt_decoder.js;"
    arjs="sourceType: webcam; debugUIEnabled: false; detectionMode: mono_and_matrix; matrixCodeType: 3x3;">

    <a-assets>
      <!-- Preload the compressed .glb asset -->
      <a-asset-item id="ghostModel" src="./ghost-meshopt.glb"></a-asset-item>
    </a-assets>

    <!-- Matrix/Barcode Target #5 -->
    <a-marker type="barcode" value="5">
      
      <!-- Ambient light so the ghost texture displays bright and clear -->
      <a-entity light="type: ambient; color: #ffffff; intensity: 1.5;"></a-entity>

      <!-- 3D Ghost Model -->
      <a-entity
        gltf-model="#ghostModel"
        position="0 0 0"
        rotation="0 0 0"
        scale="0.5 0.5 0.5">
      </a-entity>

    </a-marker>

    <!-- Camera -->
    <a-entity camera></a-entity>

  </a-scene>

</body>
</html>
